[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-tic-tac-toe"
version = "0.2.0"
description = "Tic-tac-toe with math challenges, in English and Portuguese"
requires-python = ">=3.10"
# Runtime dependencies: these are the packages bundled into the mobile app.
dependencies = [
    "flet>=1.0,<2",
]

[project.optional-dependencies]
# Development tools only; never bundled into the mobile app.
dev = [
    "flet[cli,web]>=1.0,<2",  # `flet run --android/--ios` and `flet build`
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.17.3",
]

[tool.flet.app]
# Folder packaged into the mobile app; its `main.py` is the entry point.
path = "src"
# Created inside `src/` by `pip install -e .`; not part of the app.
exclude = ["math_tic_tac_toe.egg-info"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["math_tic_tac_toe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every run measures coverage and fails if it drops below `fail_under`.
addopts = "-q --cov"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming conventions
    "B",    # likely bugs
    "UP",   # modern Python syntax
    "SIM",  # simplifications
]
